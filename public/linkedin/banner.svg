<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" fill="none" role="img" aria-label="Sergio Rodriguez · Frontend Developer &amp; Project Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1b22"/>
      <stop offset="0.55" stop-color="#0f1014"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#c5cad4"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1a1b22"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="logoStroke" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c5cad4"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.85" cy="0.2" r="0.45" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#c5cad4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.1" cy="0.85" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#6b7eff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0L0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#orb1)"/>
  <rect width="1584" height="396" fill="url(#orb2)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1583" height="395" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Status pill (top-left of safe zone) -->
  <g transform="translate(396, 70)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="18" cy="16" r="4" fill="#86efac"/>
    <circle cx="18" cy="16" r="7" fill="none" stroke="#86efac" stroke-opacity="0.4"/>
    <text x="36" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#c5cad4" letter-spacing="2">DISPONIBLE · Q2 2026</text>
  </g>

  <!-- Name -->
  <text x="396" y="180" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="900" fill="#f0f0f5" letter-spacing="-2.5">Sergio Rodríguez</text>

  <!-- Subtitle -->
  <text x="398" y="218" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="500" fill="#8a8a92" letter-spacing="0.2">Frontend Developer  ·  Project Manager</text>

  <!-- Tagline cromo -->
  <text x="396" y="278" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#cromo)" letter-spacing="-0.5">Construyo producto que escala — en producción.</text>

  <!-- Footer info row -->
  <g transform="translate(396, 318)">
    <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6b6c75" letter-spacing="0.3">5+ años</text>
    <circle cx="68" cy="9" r="1.5" fill="#6b6c75"/>
    <text x="80" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6b6c75" letter-spacing="0.3">30+ proyectos</text>
    <circle cx="194" cy="9" r="1.5" fill="#6b6c75"/>
    <text x="206" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6b6c75" letter-spacing="0.3">ES · EAU · LATAM</text>
    <circle cx="346" cy="9" r="1.5" fill="#6b6c75"/>
    <text x="358" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#c5cad4" letter-spacing="0.3">sergiorp.com</text>
  </g>

  <!-- Glass S monogram (right side, 256x256 at viewBox 64) -->
  <g transform="translate(984, 70) scale(4)">
    <rect width="64" height="64" rx="14" fill="url(#logoBg)"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.4"/>
    <path d="M46 19 Q46 12 39 12 L25 12 Q17 12 17 20 Q17 28 25 28 L39 28 Q47 28 47 36 Q47 44 39 44 L25 44 Q17 44 17 51" stroke="url(#logoStroke)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="50" cy="14" r="2.4" fill="#c5cad4"/>
  </g>

  <!-- Subtle frame chrome glints (decorative diagonals) -->
  <g opacity="0.18">
    <line x1="0" y1="120" x2="80" y2="40" stroke="#c5cad4" stroke-width="1"/>
    <line x1="1504" y1="356" x2="1584" y2="276" stroke="#c5cad4" stroke-width="1"/>
  </g>
</svg>
